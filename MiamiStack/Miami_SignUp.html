<!DOCTYPE html>
<html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<head>
  <title>COP 4331 MIAMI LAMP Stack</title>
  <script type="text/javascript" src="js/md5.js"></script>
  <script type="text/javascript" src="js/code.js"></script>
    <link href="css/Miami_styles.css" rel="stylesheet"> 
    <link href="https://fonts.googleapis.com/css?family=Ubuntu" rel="stylesheet">
</head>
<body>

<!--<h1 id="title">COP 4331 MIAMI LAMP STACK</h1>-->
<h1 id="title">Manage My Miami</h1> <!-- Make a button to link to home page or github?-->

<img class="logo" src="images/MiamiLogo.png" alt="logo">

<button class="navText" id="aboutBut"> About </button>
<button class="navText" id="settingBut"> Settings </button>
<button class="navBorder" id="signInBut" type="button" onclick="goToSignIn();"> Sign In </button>

<div id="loginDiv">
  <div id="circleDivReg">
  <span id="inner-title-reg">Register</span>

    <div id="firstNamePosition" class="inputDiv center">
      <input type="text" id="enterFirstName" class="centerInDiv" placeholder="Enter First Name " 
        title="Please Fill out Field" /><br />
    </div>

    <div id="lastNamePosition" class="inputDiv center">
      <input type="text" id="enterLastName" class="centerInDiv" placeholder="Enter Last Name"
        title="Please Fill out Field"/><br />
    </div>

    <div id="usernamePosition" class="inputDiv center">
      <input type="text" id="createUsername" class="centerInDiv" placeholder="Create Username"
        title="Must Be 3-13 Characters Long and Have Least One Uppercase Letter" /><br />
    </div>

    <div id="passwordPosition" class="inputDiv center">
      <input type="password" id="createPassword" class="centerInDiv" placeholder="Create Password"
        pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*]).{8,32}" title="Must be 8-32 
        Characters Long,Have One Uppercase & Lowercase Letter, 
        and Have One Number & Special Character"/><br />
    </div>

  <button type="button" id="signUpButton" class="buttons" onclick="register();"> Sign Up </button>

  <span id="loginResult"></span>
    <div id="textBox">
      <h3 id="headerReq">Password must contain the following:</h3>
      <p id="upperCaseReq" class="invalid"> Least One Uppercase Letter </p>
      <p id="lowerCaseReq" class="invalid"> Least One Lowercase Letter </p>
      <p id="numberSpecialCharReq" class="invalid"> Least One Number & Special Character</p>
      <p id="charRangeReq" class="invalid"> Between 8-32 Characters </p>
    </div>
  </div>
</div>

<script>
let firstNameInput = document.getElementById("enterFirstName");
let lastNameInput = document.getElementById("enterLastName");
let usernameInput = document.getElementById("createUsername");
let passwordInput = document.getElementById("createPassword");
let letter = document.getElementById("lowerCaseReq");
let capital = document.getElementById("upperCaseReq");
let number = document.getElementById("numberSpecialCharReq");
let length = document.getElementById("charRangeReq");

firstNameInput.onfocus = function() 
{
  if (document.getElementById("firstNamePosition").classList.contains("invalid"))
  {
    document.getElementById("firstNamePosition").classList.remove("invalid");
  }
}

lastNameInput.onfocus = function() 
{
  if (document.getElementById("lastNamePosition").classList.contains("invalid"))
  {
    document.getElementById("lastNamePosition").classList.remove("invalid");
  }
}

usernameInput.onfocus = function() 
{
  if (document.getElementById("usernamePosition").classList.contains("invalid"))
  {
    document.getElementById("usernamePosition").classList.remove("invalid");
  }
}

//When the user clicks on the password field, show the message box
passwordInput.onfocus = function() 
{
  if (document.getElementById("passwordPosition").classList.contains("invalid"))
  {
    document.getElementById("passwordPosition").classList.remove("invalid");
  }

  document.getElementById("textBox").style.display = "block";
}

// When the user clicks outside of the password field, hide the message box
passwordInput.onblur = function() 
{
  document.getElementById("textBox").style.display = "none";
}

//When the user starts to type something inside the password field
passwordInput.onkeyup = function() 
{
  // Validate lowercase letters
  let lowerCaseLetters = /[a-z]/g;
  if(passwordInput.value.match(lowerCaseLetters)) 
  {
    letter.classList.remove("invalid");
    letter.classList.add("valid");
  } 
  else 
  {
    letter.classList.remove("valid");
    letter.classList.add("invalid");
  }

  // Validate capital letters
  let upperCaseLetters = /[A-Z]/g;
  if(passwordInput.value.match(upperCaseLetters)) 
  {
    capital.classList.remove("invalid");
    capital.classList.add("valid");
  } 
  else 
  {
    capital.classList.remove("valid");
    capital.classList.add("invalid");
  }

  // Validate numbers
  let numbers = /[0-9]/g;
  let specialChar = /[!@#$%]/g;
  if(passwordInput.value.match(numbers) && passwordInput.value.match(specialChar)) 
  {
    number.classList.remove("invalid");
    number.classList.add("valid");
  } 
  else 
  {
    number.classList.remove("valid");
    number.classList.add("invalid");
  }

  // Validate length
  if(passwordInput.value.length >= 8 && passwordInput.value.length <= 32) 
  {
    length.classList.remove("invalid");
    length.classList.add("valid");
  } 
  else 
  {
    length.classList.remove("valid");
    length.classList.add("invalid");
  }
}
</script>

</body>
</html>
