name: Cicd Pipeline

on:
  push:
    branches: [ main ]

jobs:
  serverSync:
    runs-on: ubuntu-latest

    steps:
      - name: checkout action
        uses: actions/checkout@v3

      - name: ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSHKEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.SERVERDOMAIN }} >> ~/.ssh/known_hosts

      - name: upload to server
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.USER }}@${{ secrets.SERVERDOMAIN }} "cd /var/www/html && git pull origin main"

